[project]
name = "scrub-voice"
version = "0.1.0"
description = "Offline Surgical Voice Assistant"
readme = "README.md"
requires-python = ">=3.10, <3.14"

dependencies = [
    # DSP & Audio
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "soundfile>=0.12.0",
    "sounddevice>=0.4.7",

    # Inter-Process Communication & Web Gateway
    "pyzmq>=25.0.0",
    "jsonschema>=4.20.0",
    "orjson>=3.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "httpx>=0.27.0",

    # NLU & Machine Learning
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.38.0",
    "sentence-transformers>=2.7.0",
    "setfit>=1.0.3",
    "scikit-learn>=1.3.0",
    "onnxruntime>=1.15.0",
    "onnx>=1.14.0",
    "onnxscript>=0.1.0",
    "psutil>=5.9.0",

    # ASR
    "vosk>=0.3.45",
    "faster-whisper>=1.0.3",
    "requests>=2.31.0",
    "jiwer>=3.0.4",

    # Utilities & Simulation
    "mujoco>=3.1.0",
]

[tool.uv]
package = false
link-mode = "copy"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

